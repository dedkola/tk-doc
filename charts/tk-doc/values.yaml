# Default values for tk-doc.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of application replicas.
replicaCount: 1

image:
  # -- Container image repository.
  repository: ghcr.io/dedkola/tk-doc
  # -- Container image pull policy. Always ensures a fresh install pulls the
  # current image for the selected tag.
  pullPolicy: Always
  # -- Container image tag. Pin this to an immutable tag for production.
  tag: "latest"

# -- Image pull secrets for private registries. The default GHCR image is public.
imagePullSecrets: []

# -- Override the chart name.
nameOverride: ""

# -- Override the full release name.
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created.
  create: false
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# -- Pod annotations.
podAnnotations: {}

# -- Pod labels.
podLabels: {}

# -- Pod security context.
podSecurityContext: {}

# -- Container security context.
securityContext: {}

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Container port to expose.
  targetPort: 3000
  # -- Service protocol.
  protocol: TCP
  # -- Service name.
  name: http
  # -- Service annotations.
  annotations: {}

ingress:
  # -- Enable ingress resource.
  # For k3s with NGINX Ingress + MetalLB, leave hosts empty to expose the app
  # on the default ingress IP with no domain.
  enabled: true
  # -- Ingress class name.
  className: nginx
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hosts. Leave empty for the default backend (no domain).
  hosts: []
  # -- Ingress TLS configuration. Leave empty to disable HTTPS.
  tls: []
  # Example with a custom domain:
  # hosts:
  #   - host: docs.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  #         servicePort: 80
  # tls:
  #   - secretName: docs-tls
  #     hosts:
  #       - docs.example.com

# -- Resource requests and limits.
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

# -- Extra environment variables for the container.
env: []

# -- Extra envFrom sources to load into the container.
# Each item is rendered as-is under envFrom.
envFrom: []
#  - secretRef:
#      name: tk-doc-secrets

livenessProbe:
  # -- Enable liveness probe.
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  # -- Enable readiness probe.
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

config:
  # -- Enable ConfigMap creation.
  enabled: true
  # -- ConfigMap data entries.
  data:
    NODE_ENV: "production"
    DOCKER_BUILD: "true"

autoscaling:
  # -- Enable Horizontal Pod Autoscaler.
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling.
tolerations: []

# -- Affinity rules for pod scheduling.
affinity: {}
